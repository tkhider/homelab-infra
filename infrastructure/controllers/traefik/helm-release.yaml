---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: traefik
      version: '41.7.0'
      sourceRef:
        kind: HelmRepository
        name: traefik-repository
        namespace: traefik
  values:
    service:
      annotations:
        metallb.io/ip-address-pool: first-pool
      spec:
        externalTrafficPolicy: Local
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        allowExternalNameServices: true
    ports:
      web:
        forwardedHeaders:
          trustedIPs: &trustedForwardedIPs
            - 10.244.0.0/16 # cluster pod CIDR, needed so headers forwarded by the in-cluster cloudflared tunnel pods are trusted
        http:
          aliasHeadersStrategy: delete
      websecure:
        forwardedHeaders:
          trustedIPs: *trustedForwardedIPs
        http:
          aliasHeadersStrategy: delete
