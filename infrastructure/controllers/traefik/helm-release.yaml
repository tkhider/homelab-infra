# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: traefik
      version: '41.0.2'
      sourceRef:
        kind: HelmRepository
        name: traefik-repository
        namespace: flux-system
  values:
    service:
      spec:
        externalTrafficPolicy: Local
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    ports:
      web:
        forwardedHeaders:
          trustedIPs: &trustedForwardedIPs
            - 10.10.93.0/24
      websecure:
        forwardedHeaders:
          trustedIPs: *trustedForwardedIPs
