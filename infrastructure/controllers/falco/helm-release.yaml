apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: falco
      version: 9.2.2
      sourceRef:
        kind: HelmRepository
        name: falco-repository
      interval: 5m
  releaseName: falco
  install:
    remediation:
      retries: 3
  values:
    driver:
      kind: modern_ebpf
    falco:
      json_output: true
    metrics:
      enabled: true
    serviceMonitor:
      create: true
      labels:
        release: kube-prometheus-stack
