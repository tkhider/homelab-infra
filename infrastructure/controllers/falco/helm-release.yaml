apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: falco
      version: 9.2.2
      sourceRef:
        kind: HelmRepository
        name: falco-repository
      interval: 5m
  releaseName: falco
  install:
    remediation:
      retries: 3
  values:
    driver:
      kind: modern_ebpf
    falco:
      json_output: true
      syscall_event_drops:
        actions:
          - log
    metrics:
      enabled: true
    serviceMonitor:
      create: true
      labels:
        release: kube-prometheus-stack
    falcosidekick:
      enabled: true
      replicaCount: 1
      config:
        alertmanager:
          hostport: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
          endpoint: /api/v2/alerts
          minimumpriority: critical
    customRules:
      talos.yaml: |-
        - macro: known_drop_and_execute_activities
          condition: (container.id = runtime and proc.pname = containerd and proc.exepath startswith /opt/cni/bin/)
          override:
            condition: replace
