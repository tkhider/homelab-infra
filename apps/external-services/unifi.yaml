apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: external-services
spec:
  type: ExternalName
  externalName: 10.10.93.1
  ports:
    - port: 443
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi.local.khider.fr-cert
  namespace: external-services
spec:
  secretName: unifi-cert
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
  dnsNames:
    - unifi.local.khider.fr
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi-ingress-route
  namespace: external-services
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`unifi.local.khider.fr`)
      services:
        - name: unifi
          port: 443
          scheme: https
          serversTransport: insecure-skip-verify
      middlewares:
        - name: default-headers
        - name: default-whitelist
  tls:
    secretName: unifi-cert
