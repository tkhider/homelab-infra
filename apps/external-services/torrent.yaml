apiVersion: v1
kind: Service
metadata:
  name: synology-torrent
  namespace: external-services
spec:
  type: ExternalName
  externalName: 10.10.93.22
  ports:
    - port: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: torrent.khider.fr-cert
  namespace: external-services
spec:
  secretName: torrent-cert
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
  dnsNames:
    - torrent.khider.fr
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: torrent-middleware
  namespace: external-services
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: torrent-ingress-route
  namespace: external-services
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`torrent.khider.fr`)
      services:
        - name: synology-torrent
          port: 8080
      middlewares:
        - name: torrent-middleware
  tls:
    secretName: torrent-cert
