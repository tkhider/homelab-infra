# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: khider-fr
  namespace: web
spec:
  interval: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    nameOverride: khider-fr-prod

    controllers:
      khider-fr:
        replicas: 2
        containers:
          main:
            image:
              repository: ghcr.io/tkhider/khider.fr
              tag: latest@sha256:b4add850980659ec2d83f70f0b323d7966591c3281236e41416af614edd39c3c
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

    service:
      main:
        controller: khider-fr
        ports:
          http:
            port: 80
            targetPort: 8080

    # nginx writes its pid file and temp buffers to /tmp
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    ingress:
      main:
        enabled: false
