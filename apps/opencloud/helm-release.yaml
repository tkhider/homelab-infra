# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud
  namespace: opencloud
spec:
  interval: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      opencloud:
        strategy: Recreate
        pod:
          labels:
            app.kubernetes.io/component: app
        containers:
          main:
            image:
              repository: docker.io/opencloudeu/opencloud
              tag: 7.2.4
            command:
              - /bin/sh
              - -c
              - opencloud init || true; opencloud server
            env:
              OC_URL: https://opencloud.local.khider.fr
              OC_INSECURE: "false"
              OC_LOG_LEVEL: info
              PROXY_TLS: "false"
              PROXY_DEBUG_ADDR: 0.0.0.0:9205
              IDM_CREATE_DEMO_USERS: "false"
              IDM_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: opencloud-secrets
                    key: IDM_ADMIN_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9205
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 9205
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 9205
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          opencloud:
            main:
              - path: /etc/opencloud
                subPath: config
              - path: /var/lib/opencloud
                subPath: data

    service:
      opencloud:
        controller: opencloud
        ports:
          http:
            port: 9200

    ingress:
      opencloud:
        enabled: false
