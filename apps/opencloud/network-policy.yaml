apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencloud
  namespace: opencloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opencloud
      app.kubernetes.io/component: app
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEntities:
        - world
