apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: nextcloud
      version: "9.2.6"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
      interval: 5m
  releaseName: nextcloud
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nextcloud:
      host: cloud.khider.fr
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        usernameKey: admin-username
        passwordKey: admin-password

    persistence:
      enabled: true
      storageClass: "synostorage"
      accessMode: ReadWriteOnce
      size: 5Gi

    internalDatabase:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: "nextcloud-postgresql:5432"
      user: nextcloud
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        passwordKey: db-password

    postgresql:
      enabled: true
      auth:
        database: nextcloud
        username: nextcloud
        existingSecret: nextcloud-secrets
        secretKeys:
          userPasswordKey: db-password
          adminPasswordKey: db-postgres-password
      global:
        postgresql:
          auth:
            database: nextcloud
            existingSecret: nextcloud-secrets
            secretKeys:
              userPasswordKey: db-password
              adminPasswordKey: db-postgres-password
      primary:
        persistence:
          enabled: true
          storageClass: "synostorage"
          size: 20Gi
