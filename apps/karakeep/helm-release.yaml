# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system

  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      karakeep:
        pod:
          labels:
            app.kubernetes.io/component: app
        containers:
          main:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2
            env:
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              BROWSER_WEB_URL: http://karakeep-chrome.karakeep.svc.cluster.local:9222
              MEILI_ADDR: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secrets
                    key: MEILI_MASTER_KEY
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secrets
                    key: NEXTAUTH_SECRET
              NEXTAUTH_URL: https://karakeep.local.khider.fr
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              DISABLE_NEW_RELEASE_CHECK: true
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

      chrome:
        pod:
          labels:
            app.kubernetes.io/component: chrome
        containers:
          main:
            image:
              repository: docker.io/zenika/alpine-chrome
              tag: "124"
            command:
              - chromium-browser
            args:
              - --headless
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

      meilisearch:
        pod:
          labels:
            app.kubernetes.io/component: meilisearch
        containers:
          main:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.2
            args:
              - /bin/meilisearch
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secrets
                    key: MEILI_MASTER_KEY
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          karakeep:
            main:
              - path: /data
                subPath: karakeep
          meilisearch:
            main:
              - path: /meili_data
                subPath: meilisearch
      run:
        type: emptyDir
        advancedMounts:
          karakeep:
            main:
              - path: /run

    service:
      karakeep:
        controller: karakeep
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700

    ingress:
      karakeep:
        enabled: false
