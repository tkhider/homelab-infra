apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: torrent.khider.fr-cert
  namespace: downloads
spec:
  secretName: torrent-cert
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
  dnsNames:
    - torrent.khider.fr
---
# Authentik is the only login in front of qbittorrent: the WebUI skips its own
# auth for pod IPs, and the network policy only lets Traefik and Sonarr in.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: downloads
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent-ingress-route
  namespace: downloads
spec:
  # Both entrypoints, like the route it replaces: the tunnel may reach Traefik on either
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`torrent.khider.fr`)
      services:
        - name: qbittorrent
          port: 8080
      middlewares:
        - name: authentik
  tls:
    secretName: torrent-cert
